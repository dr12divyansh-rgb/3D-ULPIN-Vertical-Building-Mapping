dataset:
  # source=stpls3d reuses STPLS3DChunkDataset which handles any NPZ manifest
  # in the common schema {xyz:(4096,3)f32, rgb:(4096,3)u8, labels:(4096,)u8}.
  # DALES NPZs are produced by prepare_dales.py with the same schema.
  source: stpls3d
  data_root: ml/data/dales_chunks
  num_points: 4096
  input_mode: xyzrgb
  num_workers: 0
  max_train_chunks: 500
  max_val_chunks: 150
  preload: false
classes:
  ground: 0
  building: 1
  vegetation: 2
  road: 3
  vehicle: 4
  other: 5
model:
  name: pointnet++
  num_classes: 6
  sa1:
    npoint: 512
    radius: 0.2
    nsample: 32
    mlp:
    - 64
    - 64
    - 128
  sa2:
    npoint: 128
    radius: 0.4
    nsample: 32
    mlp:
    - 128
    - 128
    - 256
training:
  epochs: 20
  batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 0.0001
  weight_decay: 0.0001
  seed: 26011
  device: auto
  log_interval: 50
  # DALES has no road class (project class 3), so inverse-frequency weighting
  # gives road an enormous weight that crushes all other classes.
  # For fine-tuning from Exp005, unweighted CE is appropriate:
  # building is 22% of data, building is already well-represented.
  class_weighted_loss: false
  early_stopping_patience: 7
