# STPLS3D quick baseline: 5 epochs, 300 chunks, preload.
# Purpose: establish STPLS3D results within the available compute budget.
# Full training (25 epochs, 1500 chunks) takes ~3 hours on CPU — run separately.

dataset:
  source: "stpls3d"
  data_root: "ml/data/stpls3d"
  num_points: 4096
  input_mode: "xyz"
  num_workers: 0
  max_train_chunks: 300
  max_val_chunks: 200
  preload: true

classes:
  ground:     0
  building:   1
  vegetation: 2
  road:       3
  vehicle:    4
  other:      5

model:
  name: "pointnet++"
  num_classes: 6
  sa1:
    npoint: 512
    radius: 0.2
    nsample: 32
    mlp: [64, 64, 128]
  sa2:
    npoint: 128
    radius: 0.4
    nsample: 32
    mlp: [128, 128, 256]

training:
  epochs: 10
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  seed: 26011
  device: "auto"
  log_interval: 25
  class_weighted_loss: true
  early_stopping_patience: 5
